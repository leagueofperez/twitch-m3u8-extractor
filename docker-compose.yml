# docker-compose.yml
version: '3.8'

services:
  twitch-extractor:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app               # Sincroniza código en tiempo real
    environment:
      - FLASK_DEBUG=1        # Solo en desarrollo
    command: python app.py   # Usa el servidor de Flask (con recarga)