services:
  twitch-extractor:
    container_name: twitch-extractor
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      FLASK_DEBUG: "1"  # Desarrollo: activa debug y recarga
    command: python app.py
    networks:
      - npm_network

networks:
  npm_network:
    external: true
    name: npm_network

