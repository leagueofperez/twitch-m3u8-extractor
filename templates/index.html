<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extractor de Streams de Twitch</title>
  <meta name="description"
    content="Pega el nombre de un canal, su URL o la de un VOD y obtén las URLs m3u8 de cada calidad, listas para abrir en cualquier reproductor.">
  <meta name="theme-color" content="#6441a5">
  <meta name="color-scheme" content="light">
  <link rel="canonical" href="{{ site_url }}/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Twitch Stream Extractor">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Extractor de Streams de Twitch">
  <meta property="og:description"
    content="Obtén las URLs m3u8 de streams de Twitch en vivo y VODs por calidad.">
  <meta property="og:url" content="{{ site_url }}/">
  <meta property="og:image" content="{{ site_url }}/static/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Twitch Stream Extractor: extrae URLs m3u8 de Twitch">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Extractor de Streams de Twitch">
  <meta name="twitter:description"
    content="Obtén las URLs m3u8 de streams de Twitch en vivo y VODs por calidad.">
  <meta name="twitter:image" content="{{ site_url }}/static/og-image.png">

  <!-- Iconos. Todos se regeneran con `make icons` desde assets/icon.svg -->
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">

  <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
  <link rel="robots" href="{{ url_for('static', filename='robots.txt') }}">

  <!-- Tailwind CSS v4 desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Personalización v4: los colores van en @theme, no en tailwind.config -->
  <style type="text/tailwindcss">
    @theme {
        --color-twitch: #6441a5;
        --color-twitch-dark: #543988;
        --color-twitch-light: #775ad8;
      }
    </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

  <!-- Datos estructurados. site_url se interpola sin comillas de por medio:
       PUBLIC_URL debe ser una URL simple. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Twitch Stream Extractor",
    "url": "{{ site_url }}/",
    "description": "Extrae URLs m3u8 de streams de Twitch en vivo y VODs por calidad.",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requiere JavaScript",
    "inLanguage": "es",
    "image": "{{ site_url }}/static/og-image.png",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "EUR"
    }
  }
  </script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col items-center py-8 px-4">
  <div class="w-full max-w-2xl">
    <h1 class="text-3xl font-bold text-center text-twitch mb-2">
      Twitch Stream Extractor
    </h1>
    <p class="text-gray-600 text-center mb-6">
      Escribe el nombre del canal, su URL, o la de un VOD
    </p>

    <div class="flex gap-2 mb-6">
      <input type="text" id="twitchUrl" placeholder="admiralbulldog  ·  twitch.tv/canal  ·  twitch.tv/videos/12345"
        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"
        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-twitch focus:border-transparent focus:outline-none">
      <button id="extractBtn" type="button"
        class="px-4 py-2 bg-twitch hover:bg-twitch-dark text-white font-medium rounded-lg transition-colors duration-200 whitespace-nowrap">
        Extraer
      </button>
    </div>

    <div id="result" class="mt-6"></div>

    <!-- Región de anuncios para lectores de pantalla (copiada fuera de #result
           porque su contenido se reemplaza en cada extracción) -->
    <p id="copyStatus" class="sr-only" aria-live="polite" role="status"></p>
  </div>

  <!-- Módulo ES: necesario para el import de icons.js -->
  <script type="module" src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
